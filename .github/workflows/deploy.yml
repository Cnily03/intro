name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Build
        env:
          SITE_CONFIG: ${{ secrets.SITE_CONFIG || 'config.example.yaml' }}
          HIDE_CN_BEIAN: ${{ vars.HIDE_CN_BEIAN }}
        run: pnpm build

      # enable GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # upload artifact for deployment
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
